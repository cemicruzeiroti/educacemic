<!DOCTYPE html>
<html lang="pt-BR" class="">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro - Educa CEMI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
  </script>
  <link rel="stylesheet" href="/static/css/theme.css" />
</head>
<body class="min-h-screen">
  <header class="surface border-b sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <h1 class="text-xl font-bold link">Educa CEMI</h1>
      <div class="flex items-center gap-3">
        <button id="themeToggle" class="px-3 py-1 rounded border surface">Tema</button>
      </div>
    </div>
  </header>
  <main class="max-w-md mx-auto px-4 py-10">
    <div class="surface border rounded p-8">
      <h2 class="text-2xl font-semibold mb-6 text-center">Cadastro pÃºblico</h2>
      <form id="registerForm" class="space-y-3">
        <input name="cpf" placeholder="CPF (apenas nÃºmeros)" inputmode="numeric" pattern="[0-9]*" maxlength="11" class="w-full border rounded px-3 py-2 surface" required />
        <input name="nome_completo" placeholder="Nome completo" class="w-full border rounded px-3 py-2 surface" required />
        <input name="username" placeholder="Nome de usuÃ¡rio" class="w-full border rounded px-3 py-2 surface" required />
        <input name="password" type="password" placeholder="Senha" class="w-full border rounded px-3 py-2 surface" required />
        <button id="registerBtn" class="btn-primary px-4 py-2 rounded w-full flex items-center justify-center gap-2">
          <span id="registerSpinner" class="hidden animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
          <span>Solicitar cadastro</span>
        </button>
      </form>
      <p id="registerMsg" class="text-sm mt-2 text-center"></p>
      <p class="text-sm text-center mt-4"><a href="/" class="link">JÃ¡ possui conta? Entrar</a></p>
    </div>
  </main>
  <script src="/static/js/api.js"></script>
  <script>
    // mask CPF: only digits
    (function () {
      const cpf = document.querySelector('input[name="cpf"]');
      if (cpf) {
        cpf.addEventListener('input', function () {
          this.value = this.value.replace(/\D/g, '').slice(0, 11);
        });
      }
    })();
  </script>
  <script>
    (function initTheme() {
      const saved = localStorage.getItem('theme') || 'light';
      if (saved === 'dark') document.documentElement.classList.add('dark');
    })();
    document.getElementById('themeToggle').addEventListener('click', () => {
      const html = document.documentElement;
      html.classList.toggle('dark');
      localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light');
    });
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const btn = document.getElementById('registerBtn');
      const spinner = document.getElementById('registerSpinner');
      const f = new FormData(form);
      const msg = document.getElementById('registerMsg');
      msg.textContent = '';
      btn.disabled = true;
      btn.classList.add('opacity-60','cursor-not-allowed');
      spinner.classList.remove('hidden');
      try {
        const data = await API.post('/api/auth/register', {
          cpf: f.get('cpf'),
          nome_completo: f.get('nome_completo'),
          username: f.get('username'),
          password: f.get('password'),
        });
        msg.textContent = data.msg;
        msg.className = 'text-sm mt-2 text-center text-green-600';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'text-sm mt-2 text-center text-red-500';
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-60','cursor-not-allowed');
        spinner.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
